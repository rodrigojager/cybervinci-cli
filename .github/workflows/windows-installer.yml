name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CYBERVINCI version without the v prefix"
        required: true
        type: string
      publish-draft:
        description: "Create or update a draft GitHub release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency: windows-installer-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Azure login for optional release signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if (-not $version) {
            throw "A release version is required."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Typecheck CLI
        run: bun run typecheck
        working-directory: packages/cybervinci

      - name: Build Windows x64 and baseline CLIs
        shell: pwsh
        env:
          CYBERVINCI_VERSION: ${{ steps.version.outputs.value }}
        run: bun run packages/cybervinci/script/build.ts --single --baseline --skip-install

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build release assets
        shell: pwsh
        run: |
          .\installer\windows\build.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\dist\windows-installer"

      - name: Verify installer and global command
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\dist\windows-installer"
          $checksum = ((Get-Content "$output\CYBERVINCI-Setup-windows-x64.exe.sha256" -Raw).Trim() -split "\s+")[0]
          $parameters = @{
            InstallerPath = "$output\CYBERVINCI-Setup-windows-x64.exe"
            ExpectedSha256 = $checksum
            Version = "${{ steps.version.outputs.value }}"
            Force = $true
          }
          if ($env:AZURE_TRUSTED_SIGNING_ENDPOINT) {
            $parameters.RequireAuthenticode = $true
          }
          .\install.ps1 @parameters

          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $installBin = "$HOME\.cybervinci\bin"
          $matches = @($userPath -split ";" | Where-Object { $_.TrimEnd("\") -ieq $installBin.TrimEnd("\") })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one CYBERVINCI user PATH entry, found $($matches.Count)."
          }
          if ((& "$installBin\cybervinci.exe" --version).Trim() -ne "${{ steps.version.outputs.value }}") {
            throw "Installed CYBERVINCI version mismatch."
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cybervinci-windows-installer-${{ steps.version.outputs.value }}
          path: dist/windows-installer/*
          if-no-files-found: error

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish-draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "CYBERVINCI $tag" `
              --generate-notes `
              --draft
          }
          $assets = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\windows-installer" -File | ForEach-Object FullName
          gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
