name: stats

on:
  schedule:
    - cron: "0 12 * * *" # Run daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  stats:
    if: vars.CYBERVINCI_RELEASE_REPOSITORY != '' && github.repository == vars.CYBERVINCI_RELEASE_REPOSITORY && vars.CYBERVINCI_STATS_REPOSITORY != '' && vars.CYBERVINCI_STATS_NPM_PACKAGE != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run stats script
        run: bun script/stats.ts
        env:
          CYBERVINCI_STATS_REPOSITORY: ${{ vars.CYBERVINCI_STATS_REPOSITORY }}
          CYBERVINCI_STATS_NPM_PACKAGE: ${{ vars.CYBERVINCI_STATS_NPM_PACKAGE }}

      - name: Commit stats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add STATS.md
          git diff --staged --quiet || git commit -m "ignore: update download stats $(date -I)"
          git push
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
