name: "CYBERVINCI GitHub Action"
description: "Run a caller-supplied CYBERVINCI binary in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  binary:
    description: "Path to a trusted CYBERVINCI binary built or downloaded by the caller"
    required: true
  model:
    description: "Model to use"
    required: true
  agent:
    description: "Primary agent to use"
    required: false
  share:
    description: "Share the CYBERVINCI session"
    required: false
  prompt:
    description: "Custom prompt"
    required: false
  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of an app token exchange"
    required: false
    default: "true"
  mentions:
    description: "Comma-separated trigger phrases"
    required: false
  variant:
    description: "Provider-specific model variant"
    required: false
  oidc_base_url:
    description: "Explicit OIDC token exchange base URL for a separately configured GitHub App"
    required: false

runs:
  using: "composite"
  steps:
    - name: Stage trusted CYBERVINCI binary
      shell: bash
      env:
        CYBERVINCI_ACTION_BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        test -f "$CYBERVINCI_ACTION_BINARY"
        mkdir -p "$HOME/.cybervinci/bin"
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp "$CYBERVINCI_ACTION_BINARY" "$HOME/.cybervinci/bin/cybervinci.exe"
        else
          cp "$CYBERVINCI_ACTION_BINARY" "$HOME/.cybervinci/bin/cybervinci"
          chmod +x "$HOME/.cybervinci/bin/cybervinci"
        fi
        echo "$HOME/.cybervinci/bin" >> "$GITHUB_PATH"

    - name: Run CYBERVINCI
      shell: bash
      run: cybervinci github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        GITHUB_TOKEN: ${{ github.token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}